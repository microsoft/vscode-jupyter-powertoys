# Build and test script to run on PR and main build
name: Build and Test

permissions:
    deployments: write

on:
    pull_request:
        branches:
            - main
    workflow_dispatch:

env:
    NODE_VERSION: 20.18.2
    NPM_VERSION: 10.8.0
    IS_CI: 1

jobs:
    build:
        name: Build
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Use Node ${{env.NODE_VERSION}}
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: ${{env.NODE_VERSION}}

            - run: npm i -g npm@${{env.NPM_VERSION}}
              name: npm install npm@10.8.2

            - run: npm install
              name: npm install

            - run: npm run compile
              name: npm run compile

            - run: npm run compile-web
              name: npm run compile-web

            - run: npm run compile-webviews
              name: npm run compile-webviews

    test:
        timeout-minutes: 30
        name: Tests
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest]
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Use Node ${{env.NODE_VERSION}}
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: ${{env.NODE_VERSION}}

            - run: npm i -g npm@${{env.NPM_VERSION}}
              name: npm install npm@10.8.2

            - run: npm install
              name: npm install

            - run: npm run compile
              name: npm run compile

            - run: npm run compile-tests
              name: npm run compile-tests

            - name: Run tests using xvfb
              env:
                  DISPLAY: 10
              uses: GabrielBB/xvfb-action@b706e4e27b14669b486812790492dc50ca16b465 # v1.7
              id: test_id
              with:
                  run: npm run test
