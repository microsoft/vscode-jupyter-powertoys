# Build and test script to run on PR and main build
name: Build and Test

permissions:
    deployments: write

on:
    pull_request:
        branches:
            - main
    workflow_dispatch:

env:
    NODE_VERSION: 20.18.2
    NPM_VERSION: 10.8.0
    IS_CI: 1

jobs:
    build:
        name: Build
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@0717577d45739eb3c851188b29f50ed6c0b2194e # v2.8.0

            - name: Use Node ${{env.NODE_VERSION}}
              uses: actions/setup-node@46071b5c7a2e0c34e49c3cb8a0e792e86e18d5ea # v2.1.5
              with:
                  node-version: ${{env.NODE_VERSION}}

            - run: npm i -g npm@${{env.NPM_VERSION}}
              name: npm install npm@10.8.2

            - run: npm install
              name: npm install

            - run: npm run compile
              name: npm run compile

            - run: npm run compile-web
              name: npm run compile-web

            - run: npm run compile-webviews
              name: npm run compile-webviews

    test:
        timeout-minutes: 30
        name: Tests
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest]
        steps:
            - name: Checkout
              uses: actions/checkout@0717577d45739eb3c851188b29f50ed6c0b2194e # v2.8.0

            - name: Use Node ${{env.NODE_VERSION}}
              uses: actions/setup-node@46071b5c7a2e0c34e49c3cb8a0e792e86e18d5ea # v2.1.5
              with:
                  node-version: ${{env.NODE_VERSION}}

            - run: npm i -g npm@${{env.NPM_VERSION}}
              name: npm install npm@10.8.2

            - run: npm install
              name: npm install

            - run: npm run compile
              name: npm run compile

            - run: npm run compile-tests
              name: npm run compile-tests

            - name: Run tests using xvfb
              env:
                  DISPLAY: 10
              uses: GabrielBB/xvfb-action@f040be23a619e5ec34116f24098ad3626ceab681 # v1.4
              id: test_id
              with:
                  run: npm run test
