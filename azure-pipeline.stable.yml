trigger:
    branches:
        include:
            - main
pr: none

resources:
    repositories:
        - repository: templates
          type: github
          name: microsoft/vscode-engineering
          ref: main
          endpoint: Monaco

parameters:
    - name: publishExtension
      displayName: 🚀 Publish Extension
      type: boolean
      default: false

extends:
    template: azure-pipelines/extension/stable.yml@templates
    parameters:
        publishExtension: ${{ parameters.publishExtension }}
        skipAPIScan: >-
            ${{ or(startsWith(variables['Build.SourceBranch'], 'refs/pull/'),
                   and(startsWith(variables['Build.SourceBranch'], 'refs/heads/'),
                       notIn(variables['Build.SourceBranch'], 'refs/heads/main', 'refs/heads/release'),
                       not(startsWith(variables['Build.SourceBranch'], 'refs/heads/release/')))) }}
        buildSteps:
            - script: npm i -g npm@10.8.2
              displayName: npm install npm@10.8.2

            - script: npm ci
              displayName: Install dependencies

            - script: npm run compile
              displayName: Compile

        tsa:
            config:
                areaPath: 'Visual Studio Code Jupyter Extensions'
                serviceTreeID: '14f24efd-b502-422a-9f40-09ea7ce9cf14'
            enabled: true
